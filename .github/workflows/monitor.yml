name: X モニタリング 自動実行

on:
  # 2026-09-07: ActionsのデータセンターIPが x.com/search でCloudflareのbot判定を
  # 受けるようになり（2026-09-05〜）、毎朝0件で空振りするだけになったため定期実行を停止。
  # 収集はローカルPCのタスクスケジューラ（run_daily.bat）が担当する。
  # 住宅用プロキシ（X_PROXY_SERVER）でActionsから通ることを確認できたら、この2行を戻す。
  # schedule:
  #   - cron: '0 22 * * *'

  workflow_dispatch:
    inputs:
      report_type:
        description: 'レポートタイプ'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
      test_mode:
        description: 'テストモード（AI分析スキップ、メールは送信）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      - name: Playwright インストール
        run: playwright install chromium

      - name: 日次レポート実行
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'daily' && github.event.inputs.test_mode == 'false')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_PROXY_SERVER: ${{ secrets.X_PROXY_SERVER }}
          X_PROXY_USERNAME: ${{ secrets.X_PROXY_USERNAME }}
          X_PROXY_PASSWORD: ${{ secrets.X_PROXY_PASSWORD }}
        run: python main.py

      - name: 週次レポート実行
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'weekly' && github.event.inputs.test_mode == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_PROXY_SERVER: ${{ secrets.X_PROXY_SERVER }}
          X_PROXY_USERNAME: ${{ secrets.X_PROXY_USERNAME }}
          X_PROXY_PASSWORD: ${{ secrets.X_PROXY_PASSWORD }}
        run: python main.py --weekly

      - name: テスト実行（メール送信なし）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_PROXY_SERVER: ${{ secrets.X_PROXY_SERVER }}
          X_PROXY_USERNAME: ${{ secrets.X_PROXY_USERNAME }}
          X_PROXY_PASSWORD: ${{ secrets.X_PROXY_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.report_type }}" = "weekly" ]; then
            python main.py --weekly --test
          else
            python main.py --test
          fi

      - name: ログをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
